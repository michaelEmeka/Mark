[project]
name = "user-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "awsiotsdk>=1.31.0",
    "dj-database-url>=2.3.0",
    "django>=6.0.7",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "gunicorn>=26.0.0",
    "inflection>=0.5.1",
    "pika>=1.4.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uritemplate>=4.2.0",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "graphviz>=0.21",
    "pydotplus>=2.0.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]



[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "base.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
exclude = [
    "**/migrations/*.py"
]

[tool.ruff.lint]
ignore = ["RUF012"]
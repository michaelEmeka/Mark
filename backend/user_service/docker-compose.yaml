services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: user_service:local
    container_name: api
    env_file:
      - ./.env
    command: sh -c "uv run python manage.py migrate --noinput && uv run gunicorn base.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - user_net
    restart: unless-stopped
  
  mqtt_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: user_service:local
    container_name: mqtt_worker
    command: uv run python manage.py run_mqtt_worker
    depends_on:
      postgres:
          condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - user_net
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./mqtt/certs/aws_iot:/app/mqtt/certs/aws_iot:ro
#bind_mount: binds the local certs directory to the container's certs directory
#source:dest
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data #not an absolute pathwithout the leading slash
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posty -d markdb"]
      interval: 30s
      timeout: 30s
      retries: 5
      #start_period: 30s
    networks:
      - user_net
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" #AMQP
      - "15672:15672"
    env_file:
      - ./.env
    networks:
      - user_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 30s
      retries: 5
      #start_period: 30s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  user_net: